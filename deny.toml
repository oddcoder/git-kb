# to be used with: `cargo deny check`
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]

[licenses]
allow = ["Apache-2.0", "BSD-3-Clause", "ISC", "MIT"]
exceptions = [
    { crate = "unicode-ident", allow = ["Unicode-3.0"] },
    { crate = "unicode-normalization", allow = ["Unicode-3.0"] },
    # zlib's own license, as permissive as MIT; gix's.
    { crate = "foldhash", allow = ["Zlib"] },
    { crate = "zlib-rs", allow = ["Zlib"] },
    # Public domain.
    { crate = "notify", allow = ["CC0-1.0"] },
]
unused-allowed-license = "allow"
# A new license arriving through a test-only dependency should break here, rather than
# on the day that dependency graduates into a real one.
include-dev = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
