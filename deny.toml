# to be used with: `cargo deny check`
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]

[licenses]
allow = ["Apache-2.0", "BSD-3-Clause", "ISC", "MIT"]
exceptions = [
    { crate = "unicode-ident", allow = ["Unicode-3.0"] },
    { crate = "unicode-normalization", allow = ["Unicode-3.0"] },
    # zlib's own license, as permissive as MIT; gix's.
    { crate = "foldhash", allow = ["Zlib"] },
    { crate = "zlib-rs", allow = ["Zlib"] },
    # Public domain.
    { crate = "notify", allow = ["CC0-1.0"] },
    # MIT without its one condition, that the notice be kept; jsonschema's.
    { crate = "borrow-or-share", allow = ["MIT-0"] },
    # Pagefind's. zlib's own license and Blue Oak's, as permissive as MIT; Unicode's, for its data.
    { crate = "const_format", allow = ["Zlib"] },
    { crate = "const_format_proc_macros", allow = ["Zlib"] },
    { crate = "konst", allow = ["Zlib"] },
    { crate = "konst_macro_rules", allow = ["Zlib"] },
    { crate = "minicbor", allow = ["BlueOak-1.0.0"] },
    { crate = "minicbor-derive", allow = ["BlueOak-1.0.0"] },
    { crate = "emojis", allow = ["Unicode-3.0"] },
    # Pagefind's HTML rewriter's, from Servo: MPL-2.0 binds only their own files, which git-kb uses unchanged.
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
]
unused-allowed-license = "allow"
# A new license arriving through a test-only dependency should break here, rather than
# on the day that dependency graduates into a real one.
include-dev = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
ignore = [
    # syntect's, which has no release without it; its authors call 1.3.3 complete, needing no updates.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3, through syntect, is unmaintained but complete" },
    # Pagefind's, which has no release without them.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, a macro at build time only, through pagefind's rust-patch" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust, through pagefind's settings loader, twelf; git-kb reads YAML with yaml-rust2" },
]
