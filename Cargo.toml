[package]
name = "git-kb"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A knowledge base of Markdown in git"
repository = "https://github.com/oddcoder/git-kb"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive"] }
gix = { version = "0.89", default-features = false, features = ["parallel", "revision", "sha1"] }
ignore = "0.4"
mime_guess = "2"
notify = "8"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
similar = "3.2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy", "html"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "sync"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
