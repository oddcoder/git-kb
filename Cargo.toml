[package]
name = "git-kb"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A knowledge base of Markdown in git: served or built as a site, reviewed in place, its comments kept in git"
repository = "https://github.com/oddcoder/git-kb"
readme = "README.md"
keywords = ["git", "markdown", "documentation", "knowledge-base", "review"]
categories = ["command-line-utilities", "development-tools"]
# What a package of it holds: the code, its browser code compiled, in web/dist/, so that installing it needs no
# Node, and what the binary takes in.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/build.rs",
    "/src/**",
    "/assets/**",
    "/plugins/**",
    "/web/build.mjs",
    "/web/package.json",
    "/web/package-lock.json",
    "/web/tsconfig.json",
    "/web/src/**",
    "/web/dist/**",
]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
clap = { version = "4", features = ["derive"] }
gix = { version = "0.90", default-features = false, features = ["blame", "parallel", "revision", "sha1"] }
ignore = "0.4"
jsonschema = { version = "0.60", default-features = false }
mime_guess = "2"
notify = "8"
pagefind = { version = "1.5", default-features = false }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
similar = "3.2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy", "html"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "sync", "time", "io-util", "fs"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
toml = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }
yaml-rust2 = "0.13"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
